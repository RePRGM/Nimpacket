name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        nim-version: ['2.0.14', '2.2.4']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Nim version
        run: nim --version

      - name: Unit tests
        run: nim r --hints:off tests/unit_all.nim

      - name: Loopback integration tests
        run: nim r --hints:off --threads:on tests/integration_all.nim
        # On Windows, Defender can hold TCP ports — allow retries.
        continue-on-error: ${{ matrix.os == 'windows-latest' }}

      - name: Build example tools
        shell: bash
        run: |
          mkdir -p build
          for ex in lsadom lsausers samrenum sctl netshares \
                    ldapquery cldapquery dcping; do
            nim c -o:build/$ex --hints:off --path:src examples/$ex.nim
          done
          nim c -o:build/idlgen     --hints:off --path:src src/msrpc/idlgen/cli.nim
          nim c -o:build/msrpc-repl --hints:off --path:src src/msrpc/repl.nim

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.4'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate API docs
        run: nim doc --project --outdir:docs src/msrpc.nim
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/
